// Draw a pixel sprite anchored at bottom-center of (x, y)
function sprite(grid, x, y, s, flip=false) {
  const h = grid.length;
  let w = 0;
  for (const row of grid) if (row.length > w) w = row.length;
  const ox = Math.round(x - (w * s) / 2);
  const oy = Math.round(y - h * s);
  for (let rI = 0; rI < h; rI++) {
    const row = grid[rI];
    for (let c = 0; c < w; c++) {
      const ch = row[flip ? w - 1 - c : c];
      if (!ch || ch === '.') continue;
      ctx.fillStyle = PAL[ch];
      ctx.fillRect(ox + c * s, oy + rI * s, s, s);
    }
  }
}

// ─── Sound (Web Audio, everything synthesized) ────────────────────────────────
let AC = null, master = null, muted = false;
try { muted = localStorage.getItem('skifree_mute') === '1'; } catch(e) {}

function audio() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = muted ? 0 : 1;
    master.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function setMuted(m) {
  muted = m;
  if (master) master.gain.value = m ? 0 : 1;
  try { localStorage.setItem('skifree_mute', m ? '1' : '0'); } catch(e) {}
}

// One-shot tone; slideTo bends the pitch across the duration
function tone(freq, dur, opts = {}) {
  const { type = 'square', vol = 0.12, slideTo = 0, delay = 0 } = opts;
  const ac = audio();
  const t0 = ac.currentTime + delay;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(slideTo, 1), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

// Burst of decaying filtered noise (thumps, crunches, stomps)
function thud(dur, opts = {}) {
  const { vol = 0.2, freq = 200, delay = 0 } = opts;
  const ac = audio();
  const t0 = ac.currentTime + delay;
  const len = Math.ceil(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = ac.createBufferSource();
  src.buffer = buf;
  const f = ac.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = freq;
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t0);
}

// ─── Creature-sound synthesis ─────────────────────────────────────────────────
// Filtered noise with an envelope — breath, hisses, snorts, wing whooshes
function noiseBurst(dur, opts = {}) {
  const { vol = 0.2, freq = 800, q = 1, slideTo = 0, attack = 0.02, delay = 0, type = 'bandpass' } = opts;
  const ac = audio();
  const t0 = ac.currentTime + delay;
  const len = Math.ceil(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource();
  src.buffer = buf;
  const f = ac.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t0);
  f.Q.value = q;
  if (slideTo) f.frequency.exponentialRampToValueAtTime(Math.max(slideTo, 20), t0 + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t0);
}

// Animal roar: sawtooth with growl-rate pitch flutter, pushed through vocal
// formant filters, with a breath-noise layer. Reads as a throat, not a beep.
function roar(opts = {}) {
  const { freq = 90, dur = 0.9, rise = 1.3, drop = 0.6, rough = 26, vol = 0.26,
          formants = [350, 750], breath = 0.5, delay = 0 } = opts;
  const ac = audio();
  const t0 = ac.currentTime + delay;
  const o = ac.createOscillator();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(freq, t0);
  o.frequency.linearRampToValueAtTime(freq * rise, t0 + dur * 0.3);
  o.frequency.exponentialRampToValueAtTime(Math.max(freq * drop, 20), t0 + dur);
  const lfo = ac.createOscillator();
  lfo.type = 'triangle';
  lfo.frequency.value = rough;                 // vocal-fry flutter
  const lg = ac.createGain();
  lg.gain.value = freq * 0.22;
  lfo.connect(lg); lg.connect(o.frequency);
  const pre = ac.createGain();
  o.connect(pre);
  const out = ac.createGain();
  out.gain.setValueAtTime(0.001, t0);
  out.gain.exponentialRampToValueAtTime(vol, t0 + 0.07);
  out.gain.setValueAtTime(vol, t0 + dur * 0.55);
  out.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 320;   // chest body
  pre.connect(lp); lp.connect(out);
  for (const fq of formants) {                     // throat resonances
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = fq; bp.Q.value = 2.5;
    const bg = ac.createGain(); bg.gain.value = 0.7;
    pre.connect(bp); bp.connect(bg); bg.connect(out);
  }
  out.connect(master);
  o.start(t0); lfo.start(t0);
  o.stop(t0 + dur + 0.05); lfo.stop(t0 + dur + 0.05);
  if (breath) noiseBurst(dur * 0.9, { vol: vol * breath, freq: 700, q: 0.7, slideTo: 350, attack: 0.05, delay });
}

// Heavy footfall: sub-bass boom with a pitch drop plus ground crunch
function thump(opts = {}) {
  const { freq = 70, dur = 0.22, vol = 0.25, delay = 0 } = opts;
  const ac = audio();
  const t0 = ac.currentTime + delay;
  const o = ac.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(freq, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(freq * 0.45, 18), t0 + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.02);
  noiseBurst(dur * 0.7, { vol: vol * 0.5, freq: 180, q: 0.5, attack: 0.005, delay, type: 'lowpass' });
}

// Raptor screech: two detuned sawtooths gliding upward with a scream-noise layer
function screech(opts = {}) {
  const { freq = 650, to = 1500, dur = 0.7, vol = 0.18, delay = 0 } = opts;
  const ac = audio();
  const t0 = ac.currentTime + delay;
  for (const det of [0, 14]) {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    o.detune.value = det;
    o.frequency.setValueAtTime(freq, t0);
    o.frequency.exponentialRampToValueAtTime(to, t0 + dur * 0.7);
    o.frequency.exponentialRampToValueAtTime(to * 0.8, t0 + dur);
    const hp = ac.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 450;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.001, t0);
    g.gain.exponentialRampToValueAtTime(vol / 2, t0 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(hp); hp.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  noiseBurst(dur, { vol: vol * 0.5, freq: 2200, q: 2, slideTo: 3000, attack: 0.05, delay });
}

// Sonar-style ping with fading echoes — the UFO's voice
function ping(f, vol = 0.16, delay = 0) {
  for (let i = 0; i < 3; i++) {
    tone(f, .5, { type: 'sine', vol: vol / (i + 1), slideTo: f * 0.94, delay: delay + i * 0.26 });
  }
}

// Bison snort: hard double nose-blast with a low grunt underneath
function snort(delay = 0) {
  noiseBurst(.16, { vol: .3, freq: 420, q: 1.2, slideTo: 230, attack: .01, delay });
  noiseBurst(.14, { vol: .24, freq: 380, q: 1.2, slideTo: 220, attack: .01, delay: delay + .2 });
  thump({ freq: 130, dur: .15, vol: .14, delay });
}

// Continuous ski-on-snow hiss, gain tracks speed and carving
let skiSrc = null, skiGain = null, skiFilter = null;
function skiLoopStart() {
  const ac = audio();
  skiLoopStop();
  const len = ac.sampleRate;
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  skiSrc = ac.createBufferSource();
  skiSrc.buffer = buf; skiSrc.loop = true;
  skiFilter = ac.createBiquadFilter();
  skiFilter.type = 'lowpass'; skiFilter.frequency.value = 500;
  skiGain = ac.createGain(); skiGain.gain.value = 0;
  skiSrc.connect(skiFilter); skiFilter.connect(skiGain); skiGain.connect(master);
  skiSrc.start();
}
function skiLoopStop() {
  if (skiSrc) { try { skiSrc.stop(); } catch(e) {} skiSrc = null; skiGain = null; }
}
function skiLoopUpdate() {
  if (!skiGain) return;
  const spd = worldSpeed / MAX_SPEED;
  const carve = Math.abs(skier.vx) > 120 ? 0.05 : 0;
  const grounded = skier.airT > 0 ? 0 : 1;   // silence mid-air
  const duck = skiDuck > 0 ? 0.25 : 1;       // make room for villain entrances
  skiGain.gain.value = (0.02 + spd * 0.08 + carve) * grounded * duck;
  skiFilter.frequency.value = 400 + spd * 900 + (carve ? 500 : 0);
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function circleOverlap(ax, ay, ar, bx, by, br) {
  const dx = ax - bx, dy = ay - by;
  const r = ar + br;
  return dx*dx + dy*dy < r*r;
}
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

function drawText(text, x, y, size, color, align='center', weight='bold') {
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

// Windows 3.1-style beveled panel
function bevel(x, y, w, h, sunken=false) {
  ctx.fillStyle = '#c0c0c0';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = sunken ? '#404040' : '#ffffff';
  ctx.fillRect(x, y, w, 2);
  ctx.fillRect(x, y, 2, h);
  ctx.fillStyle = sunken ? '#ffffff' : '#404040';
  ctx.fillRect(x, y + h - 2, w, 2);
  ctx.fillRect(x + w - 2, y, 2, h);
}

const AD_LOGO_COLORS = ['#000080', '#800080', '#006000', '#b00000', '#806000'];
const HOUSE_TOP = {
  tagline: 'RENT THIS SPACE — $10 / week',
  business: 'AD SPACE AVAILABLE',

};

};
let adList = [];

async function fetchAds() {
  if (lbEnabled()) {
    try {
      const r = await fetch(
        `${LB_URL}/rest/v1/ads?select=tagline,business,url,tier`,
        { headers: { apikey: LB_KEY, Authorization: `Bearer ${LB_KEY}` } }
      );
      if (r.ok) adList = await r.json();
    } catch (e) { /* offline — house ads carry the day */ }
  }
  renderAds();
}

function adHash(s) {
  let h = 0;
  for (const c of (s || '')) h = (h * 31 + c.charCodeAt(0)) % 9973;
  return h;
}

function makeAdEl(ad, size) {
  const a = document.createElement('a');
  a.className = 'ad ' + (size === 'premium' ? 'ad-premium' : 'ad-basic');
  a.target = '_blank';
  a.rel = 'noopener sponsored';
  a.href = /^https?:\/\//.test(ad.url) ? ad.url : 'https://skifree2.com/advertise/';

  const chip = document.createElement('span');
  chip.className = 'ad-chip';
  chip.textContent = ad.house ? '★' : 'AD';

  const tag = document.createElement('span');
  tag.className = 'ad-tag';
  tag.textContent = ad.tagline || '';                 // textContent = XSS-safe

  const logo = document.createElement('span');
  logo.className = 'ad-logo';
  logo.textContent = ad.business || '';
  logo.style.background = AD_LOGO_COLORS[adHash(ad.business) % AD_LOGO_COLORS.length];

  a.append(chip, tag, logo);
  return a;
}

function renderAds() {
  const top = document.getElementById('ad-top');
  const bot = document.getElementById('ad-bottom');
  if (!top || !bot) return;
  const ok = a => a && a.tagline && a.url;
  const prem   = adList.filter(a => ok(a) && a.tier === 'premium');
  const basics = adList.filter(a => ok(a) && a.tier !== 'premium');
  const topAd = prem.length   ? prem[Math.floor(Math.random() * prem.length)]     : HOUSE_TOP;
  const botAd = basics.length ? basics[Math.floor(Math.random() * basics.length)] : HOUSE_BOTTOM;
  top.replaceChildren(makeAdEl(topAd, 'premium'));
  bot.replaceChildren(makeAdEl(botAd, 'basic'));
  fitCanvas();
}

const entry = { slots: ['A','A','A'], idx: 0, submitting: false, rank: 0 };

async function fetchLB(force = false) {
  if (!lbEnabled()) return;
  if (!force && lbScores && Date.now() - lbFetchedAt < 60000) return;
  try {
    const r = await fetch(
      `${LB_URL}/rest/v1/scores?select=initials,distance&order=distance.desc&limit=10`,
      { headers: { apikey: LB_KEY, Authorization: `Bearer ${LB_KEY}` } }
    );
    if (r.ok) { lbScores = await r.json(); lbFetchedAt = Date.now(); }
  } catch (e) { /* offline / misconfigured — leaderboard stays dormant */ }
}

function qualifiesLB(d) {
  if (!lbEnabled() || lbScores === null || d < 10) return false;
  return lbScores.length < 10 || d > lbScores[lbScores.length - 1].distance;
}

function cycleEntryChar(dir) {
  const i = LB_CHARS.indexOf(entry.slots[entry.idx]);
  entry.slots[entry.idx] = LB_CHARS[(i + dir + LB_CHARS.length) % LB_CHARS.length];
  sfx.hop();
}

// Layout for the entry screen's tap targets (slots, arrows, OK button)
const ENTRY_UI = {
  slotX: i => W/2 + (i - 1) * 84,
  slotY: H/2 - 6,
  slotW: 64, slotH: 74,
  okBtn: { x: W/2 - 76, y: H/2 + 116, w: 152, h: 46 }
};

// Returns true if the tap was consumed by the entry UI
function entryTap(cx, cy) {
  if (entry.submitting) return true;
  const u = ENTRY_UI;
  for (let i = 0; i < 3; i++) {
    const sx = u.slotX(i);
    if (Math.abs(cx - sx) < u.slotW / 2 + 8) {
      if (cy > u.slotY - u.slotH/2 - 56 && cy < u.slotY - u.slotH/2) {
        entry.idx = i; cycleEntryChar(1); return true;    // ▲ above slot
      }
      if (cy > u.slotY + u.slotH/2 && cy < u.slotY + u.slotH/2 + 56) {
        entry.idx = i; cycleEntryChar(-1); return true;   // ▼ below slot
      }
      if (Math.abs(cy - u.slotY) < u.slotH/2) { entry.idx = i; return true; }
    }
  }
  const b = u.okBtn;
  if (cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h) {
    submitEntry(); sfx.start(); return true;
  }
  return true;   // swallow all taps on this screen
}

function submitEntry() {
  if (entry.submitting) return;
  entry.submitting = true;
  const initials = entry.slots.join('');
  try { localStorage.setItem('skifree_initials', initials); } catch (e) {}
  const d = distance;
  fetch(`${LB_URL}/rest/v1/scores`, {
    method: 'POST',
    headers: {
      apikey: LB_KEY, Authorization: `Bearer ${LB_KEY}`,
      'Content-Type': 'application/json', Prefer: 'return=minimal'
    },
    body: JSON.stringify({ initials, distance: d })
  }).catch(() => {}).finally(() => {
    fetchLB(true).finally(() => {
      entry.rank = lbScores ? lbScores.filter(s => s.distance > d).length + 1 : 0;
      entry.submitting = false;
      gameState = STATES.GAMEOVER;
    });
  });
}

// ─── Tilt controls (mobile gyroscope) ─────────────────────────────────────────
// Roll (left/right tilt) steers; pitch (forward/back tilt) adjusts speed.
let tiltEnabled = false;     // listener attached (permission granted where needed)
let tiltActive = false;      // actually receiving sensor data
let tiltRoll = 0, tiltPitch = 0;
let baseRoll = 0, basePitch = 0, tiltCalibrated = false;

let tiltDenied = false;
let tiltUserOff = false;   // player toggled tilt off via the badge
try { tiltUserOff = localStorage.getItem('skifree_tilt_off') === '1'; } catch (e) {}

// Tap on the top-left badge: enable tilt if not yet running, otherwise toggle
function tiltBadgeTap() {
  if (!tiltActive) { enableTilt(); return; }
  tiltUserOff = !tiltUserOff;
  try { localStorage.setItem('skifree_tilt_off', tiltUserOff ? '1' : '0'); } catch (e) {}
  sfx.hop();
}

function enableTilt() {
  if (!IS_TOUCH || tiltEnabled || !('DeviceOrientationEvent' in window)) return;
  const attach = () => {
    window.addEventListener('deviceorientation', onTilt);
    tiltEnabled = true;
  };
  // iOS 13+ requires an explicit permission request from a user gesture.
  // NOTE: iOS only honors the request from click/touchend gestures, NOT touchstart.
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(state => {
        if (state === 'granted') attach();
        else tiltDenied = true;
      })
      .catch(() => {});
  } else {
    attach();
  }
}

function onTilt(e) {
  if (e.gamma == null && e.beta == null) return;
  // Map device axes to screen roll/pitch based on current orientation
  const angle = (screen.orientation && screen.orientation.angle != null)
    ? screen.orientation.angle
    : (window.orientation || 0);
  let roll, pitch;
  if (angle === 90)                       { roll = e.beta;   pitch = -e.gamma; }
  else if (angle === -90 || angle === 270){ roll = -e.beta;  pitch = e.gamma;  }
  else if (angle === 180)                 { roll = -e.gamma; pitch = -e.beta;  }
  else                                    { roll = e.gamma;  pitch = e.beta;   }
  tiltRoll = roll;
  tiltPitch = pitch;
  if (!tiltCalibrated) {
    // First reading = neutral grip; player holds the phone however is comfy
    baseRoll = roll; basePitch = pitch; tiltCalibrated = true;
  }
  tiltActive = true;
}
let obstacles, bumps, dogs;
let trail = [];
let keys = {}, mouseX = W/2, mouseMode = false;
let globalTime = 0;
let nextMonsterAt = 0;
let liftDist = 0;

const skier = {
  x: 0, vx: 0, hitR: 11,
  airT: 0, airE: 0, airPeak: 0   // airborne jump state
};

const monster = {
  type: 'yeti', active: false,
  x: 0, worldY: 0, sy: 0,        // sy used during capture (screen space)
  vx: 0, phase: 'chase',         // chase | flee | grab | exit
  t: 0, patience: 0,
  animFrame: 0, animTimer: 0,
  exitVX: 0, exitVY: 0, dir: 1
};

// Captured-skier pose (screen space) during the capture playout
const cap = { x: 0, y: 0, rot: 0, visible: true, vy: 0 };

function resetGame() {
  worldY = 0; worldSpeed = BASE_SPEED;
  playTime = 0; distance = 0;
  deathTimer = 0; endMsg = '';
  skier.x = W / 2; skier.vx = 0;
  skier.airT = 0; skier.airE = 0; skier.airPeak = 0;
  speedAdjust = 0;
  escapeFlash = 0; monsterWarnT = 0;

  // Re-zero the tilt neutral point to however the phone is held right now
  if (tiltActive) { baseRoll = tiltRoll; basePitch = tiltPitch; }
  monster.active = false;
  monster.phase = 'chase';
  nextMonsterAt = 1600 + Math.random() * 1200;
  obstacles = []; dogs = []; trail = [];
  snowballs = []; snowballTimer = 0;
  liftDist = 0;
  makeBumps();
  spawnObstacles();
  beamStop();
  ufoHumStop();
  skiLoopStart();
  sfx.start();
  gameState = STATES.PLAYING;
}

function makeBumps() {
  bumps = Array.from({ length: 22 }, () => ({
    x: Math.random() * W,
    wy: Math.random() * 2000
  }));
}

// ─── Obstacle Spawning ───────────────────────────────────────────────────────
// ch = collision-circle vertical offset above baseline, r = radius, deco = no collide
const OBS_CFG = {
  tree:  { r: 12, ch: 12, weight: 0.26 },
  pine:  { r: 11, ch: 14, weight: 0.12 },
  rock:  { r: 11, ch: 6,  weight: 0.14 },
  stump: { r: 8,  ch: 5,  weight: 0.07 },
  sign:  { r: 8,  ch: 10, weight: 0.06 },
  flag:  { r: 0,  ch: 0,  weight: 0.09, deco: true },
  jump:  { r: 13, ch: 5,  weight: 0.11, ramp: true },
  mogul: { r: 11, ch: 3,  weight: 0.15, mogul: true }
};
const OBS_TYPES = Object.keys(OBS_CFG);

function pickObstacleType() {
  let roll = Math.random(), acc = 0;
  for (const t of OBS_TYPES) {
    acc += OBS_CFG[t].weight;
    if (roll < acc) return t;
  }
  return 'tree';
}

function spawnObstacles() {
  obstacles = obstacles.filter(o => {
    const sy = o.worldY - worldY + SKIER_Y;
    return sy > -80 && o.worldY < worldY + H + 600;
  });

  const minOnScreen = 11 + Math.floor((worldSpeed - BASE_SPEED) / 60);
  const ahead = obstacles.filter(o => o.worldY > worldY).length;
  if (ahead >= minOnScreen) return;

  const toSpawn = minOnScreen - ahead + Math.floor(Math.random() * 4);
  for (let i = 0; i < toSpawn; i++) {
    const type = pickObstacleType();
    const spawnY = worldY + H + 60 + Math.random() * 500;
    const x = Math.random() * (W - 120) + 40;
    const tooClose = obstacles.some(o =>
      Math.abs(o.x - x) < 40 && Math.abs(o.worldY - spawnY) < 34
    );
    if (!tooClose) {
      obstacles.push({ type, x, worldY: spawnY,
        variant: Math.random() < 0.5 ? 0 : 1 });
    }
  }
}

function spawnDogMaybe(dt) {
  if (Math.random() < dt * 0.06 && dogs.length < 2) {
    const fromLeft = Math.random() < 0.5;
    dogs.push({
      x: fromLeft ? -20 : W + 20,
      wy: worldY + H * (0.5 + Math.random() * 0.5),
      dir: fromLeft ? 1 : -1,
      woofT: 0
    });
  }
  dogs = dogs.filter(d => {
    const sy = d.wy - worldY + SKIER_Y;
    return sy > -60 && d.x > -60 && d.x < W + 60;
  });
}

// ─── Update ──────────────────────────────────────────────────────────────────
function update(dt) {
  if (gameState === STATES.PLAYING)  updatePlaying(dt);
  if (gameState === STATES.CRASHED)  updateCrashed(dt);
  if (gameState === STATES.CAPTURED) updateCaptured(dt);
}

function updatePlaying(dt) {
  playTime  += dt;

  // Cruise speed climbs over time; up/down adjust a persistent offset on top,
  // so braking actually holds instead of being recomputed away next frame.
  const cruise = Math.min(BASE_SPEED + playTime * SPEED_RATE, MAX_SPEED);
  if (keys['ArrowUp']   || keys['KeyW']) speedAdjust = Math.max(speedAdjust - 380 * dt, -cruise * 0.6);
  if (keys['ArrowDown'] || keys['KeyS']) speedAdjust = Math.min(speedAdjust + 320 * dt, 260);

  // Tilt pitch = speed: tilt the top edge away from you to tuck, toward you to brake
  if (tiltActive && !tiltUserOff) {
    const pitch = basePitch - tiltPitch;   // + = tilted forward
    const DEAD = 4;
    if (pitch > DEAD) {
      speedAdjust = Math.min(speedAdjust + 320 * dt * clamp((pitch - DEAD) / 15, 0, 1), 260);
    } else if (pitch < -DEAD) {
      speedAdjust = Math.max(speedAdjust - 380 * dt * clamp((-pitch - DEAD) / 15, 0, 1), -cruise * 0.6);
    }
  }

  worldSpeed = clamp(cruise + speedAdjust, BASE_SPEED * 0.4, MAX_SPEED + 200);

  worldY    += worldSpeed * dt;
  distance   = Math.floor(worldY * 0.1);
  liftDist  += 60 * dt;

  let targetVx = 0;
  if (tiltActive && !tiltUserOff) {
    // Tilt roll = steering, ~20 degrees for full lock with a small deadzone
    const roll = tiltRoll - baseRoll;
    const DEAD = 3;
    const t = Math.abs(roll) < DEAD ? 0
      : clamp((roll - Math.sign(roll) * DEAD) / 20, -1, 1);
    targetVx = t * MAX_VX;
  } else if (mouseMode) {
    const dx = mouseX - skier.x;
    targetVx = clamp(dx / 90, -1, 1) * MAX_VX;
  } else {
    if (keys['ArrowLeft']  || keys['KeyA']) targetVx = -MAX_VX;
    if (keys['ArrowRight'] || keys['KeyD']) targetVx =  MAX_VX;
  }

  const accel = 700;
  skier.vx = targetVx > skier.vx
    ? Math.min(skier.vx + accel * dt, targetVx)
    : Math.max(skier.vx - accel * dt, targetVx);
  skier.x = clamp(skier.x + skier.vx * dt, 30, W - 30);

  // Airborne timer
  if (skier.airT > 0) {
    skier.airE += dt;
    if (skier.airE >= skier.airT) {
      if (skier.airPeak > 20) sfx.land();
      skier.airT = 0; skier.airE = 0;
    }
  }

  skiLoopUpdate();

  // Ski tracks (only on the ground)
  if (skier.airT === 0) {
    trail.push({ x: skier.x, wy: worldY });
  }
  while (trail.length > 0 && trail[0].wy < worldY - (SKIER_Y + 60)) trail.shift();
  if (trail.length > 500) trail.shift();

  escapeFlash  = Math.max(0, escapeFlash - dt);
  monsterWarnT = Math.max(0, monsterWarnT - dt);
  skiDuck      = Math.max(0, skiDuck - dt);

  spawnObstacles();
  spawnDogMaybe(dt);
  updateDogs(dt);
  updateSnowballs(dt);
  updateMonster(dt);
  checkCollisions();
}

// Giant snowballs: every 5s one barrels down the far-right lane — the strip
// beside the ski lift where obstacles never spawn — so camping there never pays.
function updateSnowballs(dt) {
  snowballTimer += dt;
  if (snowballTimer >= SNOWBALL_INTERVAL) {
    snowballTimer = 0;
    snowballs.push({
      x: LIFT_X + 22 + Math.random() * (W - LIFT_X - 52),   // patrols the lift-side strip
      worldY: worldY - (SKIER_Y + 120),   // starts just above the screen
      r: 26,
      rot: 0,
      whooshed: false
    });
    sfx.rumble();
  }

  const fall = worldSpeed + H * 0.45;   // overtakes the skier decisively
  for (const b of snowballs) {
    b.worldY += fall * dt;
    b.rot += dt * 7;
    const sy = b.worldY - worldY + SKIER_Y;

    if (!b.whooshed && Math.abs(sy - SKIER_Y) < 46) {
      b.whooshed = true;
      thud(.25, { vol: .18, freq: 650 });
    }
    if (skier.airT === 0 &&
        circleOverlap(skier.x, SKIER_Y + 6, skier.hitR, b.x, sy, b.r * 0.85)) {
      crash('snowball');
      return;
    }
  }
  snowballs = snowballs.filter(b => b.worldY - worldY + SKIER_Y < H + 90);
}

function updateDogs(dt) {
  for (const d of dogs) {
    d.x += d.dir * 45 * dt;
    d.woofT -= dt;
    const sy = d.wy - worldY + SKIER_Y;
    if (d.woofT <= 0 && Math.abs(d.x - skier.x) < 110 && Math.abs(sy - SKIER_Y) < 90) {
      d.woofT = 2.5;
      sfx.woof();
    }
  }
}

// ─── Monster ──────────────────────────────────────────────────────────────────
function updateMonster(dt) {
  if (!monster.active) {
    if (worldY > nextMonsterAt) {
      monster.active = true;
      monster.type   = MON_TYPES[Math.floor(Math.random() * MON_TYPES.length)];
      monster.phase  = 'chase';
      monster.t      = 0;
      monster.x      = Math.random() < 0.5 ? -60 : W + 60;
      if (MON_DEFS[monster.type].side) {
        // ground beasts charge in from the side, slightly upslope of the skier
        monster.worldY = worldY - (80 + Math.random() * 120);
      } else {
        // flyers sneak up from behind (uphill, off the top of the screen)
        monster.worldY = worldY - (SKIER_Y + 120);
      }
      const pat = MON_DEFS[monster.type].pat;
      monster.patience = pat[0] + Math.random() * (pat[1] - pat[0]);
      monster.animFrame = 0;
      monster.animTimer = 0;
      // first cry lands ~1s after the entrance roar, then settles into rhythm
      monster.cryT = MON_SFX[monster.type].every - 1;
      monster.stepT = 0;
      monsterWarnT = 3.5;
      skiDuck = 2;                    // dip the ski hiss so the entrance cuts through
      sfx.appear[monster.type]();
    }
    return;
  }

  monster.t += dt;
  monster.animTimer += dt;
  if (monster.animTimer > 0.15) { monster.animFrame++; monster.animTimer = 0; }

  const def = MON_DEFS[monster.type];
  const monSY = monster.worldY - worldY + SKIER_Y;

  if (monster.phase === 'flee') {
    monster.worldY += (worldSpeed + 240) * dt;
    monster.x += monster.dir * 60 * dt;
    if (monSY > H + 120) {
      monsterEscaped();
    }
    return;
  }

  // chase
  if (monster.t > monster.patience) {
    monster.phase = 'flee';
    monster.dir = monster.x < W/2 ? -1 : 1;
    ufoHumStop();
    return;
  }

  // this villain's signature voice + movement sounds while it hunts you
  const vs = MON_SFX[monster.type];
  monster.cryT += dt;
  if (monster.cryT >= vs.every) { monster.cryT = 0; vs.cry(); }
  if (vs.step) {
    monster.stepT += dt;
    if (monster.stepT >= vs.step) { monster.stepT = 0; vs.stepFx(); }
  }
  if (monster.type === 'ufo') ufoHumStart();

  // Pure pursuit at the monster's OWN pace, tied to the cruise curve rather
  // than the player's actual speed — so tucking (down key) can outrun it.
  const dx = skier.x - monster.x;
  const dy = SKIER_Y - monSY;   // equals the world-space vertical gap
  const dist = Math.sqrt(dx*dx + dy*dy) || 1;
  const cruise = Math.min(BASE_SPEED + playTime * SPEED_RATE, MAX_SPEED);
  const monSpd = cruise * def.spd + 30;

  monster.vx     = (dx / dist) * monSpd;
  monster.worldY += (dy / dist) * monSpd * dt;
  monster.x      += monster.vx * dt;

  // Outran it by a good margin? It loses the trail.
  if (monSY < -520) {
    monsterEscaped();
    return;
  }

  const monSYnow = monster.worldY - worldY + SKIER_Y;
  if (circleOverlap(skier.x, SKIER_Y, skier.hitR, monster.x, monSYnow, def.hitR)) {
    startCapture(monSYnow);
  }
}

function monsterEscaped() {
  escapeMsg = `You escaped ${MON_DEFS[monster.type].name}!`;
  escapeFlash = 3;
  monster.active = false;
  nextMonsterAt = worldY + 900 + Math.random() * 1100;
  ufoHumStop();
  sfx.escape();
}

function startCapture(monSY) {
  gameState = STATES.CAPTURED;
  monster.phase = 'grab';
  monster.t = 0;
  monster.sy = monSY;          // switch monster to pure screen coords
  monster.dir = monster.x < W/2 ? -1 : 1;  // exit toward nearest side
  cap.x = skier.x;
  cap.y = SKIER_Y;
  cap.rot = 0;
  cap.visible = true;
  cap.vy = 0;
  cap.lastChomp = -1;
  worldSpeed = 0;              // freeze the slope — the show plays out on a still stage
  skiLoopStop();
  ufoHumStop();
  sfx.capture[monster.type]();
}

// Capture playout per monster type: grab animation, then carried off screen
function updateCaptured(dt) {
  monster.t += dt;
  monster.animTimer += dt;
  if (monster.animTimer > 0.12) { monster.animFrame++; monster.animTimer = 0; }
  const t = monster.t;
  const type = monster.type;
  const dir = monster.dir;

  if (monster.phase === 'grab') {
    // repeated chomping for the biters
    if ((type === 'yeti' || type === 'dino')) {
      const bite = Math.floor(t * 2);
      if (bite !== cap.lastChomp) { cap.lastChomp = bite; sfx.chomp(); }
    }

    if (type === 'yeti') {
      // bounces on the spot, then hoists skier overhead
      monster.sy += Math.sin(t * 12) * 0.8;
      if (t > 1.3) beginExit(dir * 130, 70);
    } else if (type === 'ufo') {
      // hover above skier, tractor-beam them up
      const hoverY = cap.y - 130;
      monster.x  += (cap.x - monster.x) * Math.min(4 * dt, 1);
      monster.sy += (hoverY - monster.sy) * Math.min(4 * dt, 1);
      if (t > 0.5) {
        beamStart();
        cap.y -= 95 * dt;              // beam lift
        cap.rot += 7 * dt;             // helpless spinning
        if (cap.y < monster.sy + 20) { cap.visible = false; }
      }
      if (t > 1.9) beginExit(dir * 240, -220);
    } else if (type === 'dragon') {
      // swoops onto skier, claws grab
      monster.sy += (cap.y - 46 - monster.sy) * Math.min(5 * dt, 1);
      monster.x  += (cap.x - monster.x) * Math.min(5 * dt, 1);
      if (t > 0.8) beginExit(dir * 170, -170);
    } else if (type === 'dino') {
      // chomps skier sideways into its jaws
      monster.sy += Math.sin(t * 14) * 0.6;
      cap.rot += (Math.PI/2 - cap.rot) * Math.min(6 * dt, 1);
      cap.x += (monster.x - dir * 28 - cap.x) * Math.min(5 * dt, 1);
      cap.y += (monster.sy - 34 - cap.y) * Math.min(5 * dt, 1);
      if (t > 1.1) beginExit(dir * 150, 60);
    } else if (type === 'bison') {
      // lunges and flips the skier skyward
      monster.x += dir * -30 * dt;   // small lunge toward skier
      if (t > 0.45 && cap.vy === 0) {
        cap.vy = -320;               // launch! (slower ascent = more hang time)
        sfx.whistleUp();
      }
      if (t > 0.55) beginExit(dir * 210, 90);
    }
  }

  if (monster.phase === 'exit') {
    monster.x  += monster.exitVX * dt;
    monster.sy += monster.exitVY * dt;

    // keep the villain's movement sounds going as it hauls you away
    const vs = MON_SFX[type];
    if (vs.step) {
      monster.stepT += dt;
      if (monster.stepT >= vs.step) { monster.stepT = 0; vs.stepFx(); }
    }

    // skier rides along per type
    if (type === 'yeti') {
      cap.x = monster.x; cap.y = monster.sy - 72; cap.rot = Math.PI / 2;
    } else if (type === 'dragon') {
      cap.x = monster.x; cap.y = monster.sy + 16;
      cap.rot = Math.sin(globalTime * 4) * 0.3;
    } else if (type === 'dino') {
      cap.x = monster.x - dir * 28; cap.y = monster.sy - 34; cap.rot = Math.PI / 2;
    }
    // ufo: skier already aboard (invisible); bison: skier is a free projectile
  }

  // bison launch physics (runs in both phases once launched)
  if (type === 'bison' && cap.vy !== 0) {
    cap.y += cap.vy * dt;
    cap.x += dir * 40 * dt;
    cap.rot += 21 * dt;    // ~3 full flips on the way off the top of the screen
  }

  // done when everyone is off screen (the skier rides with the monster,
  // except the bison launch where they fly off the top separately)
  const monOff = monster.x < -90 || monster.x > W + 90 || monster.sy < -100 || monster.sy > H + 100;
  if (monster.phase === 'exit' && monOff && (type !== 'bison' || cap.y < -60)) {
    endMsg = MON_DEFS[type].msg;
    goGameOver();
  }
}

function beginExit(vx, vy) {
  monster.phase = 'exit';
  monster.exitVX = vx;
  monster.exitVY = vy;
  beamStop();
  const vs = MON_SFX[monster.type];
  if (vs.exit) vs.exit();
  monster.stepT = 0;
}

// ─── Collisions ───────────────────────────────────────────────────────────────
function checkCollisions() {
  // Lift towers (fixed x, every 450 world units)
  if (skier.airT === 0) {
    const m0 = Math.floor((worldY - SKIER_Y) / 450);
    for (let m = m0; m < m0 + 3; m++) {
      const sy = m * 450 - worldY + SKIER_Y;
      if (circleOverlap(skier.x, SKIER_Y + 6, skier.hitR, LIFT_X, sy - 8, 9)) {
        crash('tower');
        return;
      }
    }
  }

  for (const obs of obstacles) {
    const cfg = OBS_CFG[obs.type];
    if (cfg.deco) continue;
    const sy = obs.worldY - worldY + SKIER_Y;
    if (Math.abs(obs.x - skier.x) > 80 || Math.abs(sy - SKIER_Y) > 80) continue;
    if (!circleOverlap(skier.x, SKIER_Y + 6, skier.hitR, obs.x, sy - cfg.ch, cfg.r)) continue;

    if (cfg.ramp) {
      if (skier.airT === 0) {           // big air off the ramp
        skier.airT = 1.15; skier.airE = 0; skier.airPeak = 36;
        sfx.jump();
      }
    } else if (cfg.mogul) {
      if (skier.airT === 0) {           // little hop
        skier.airT = 0.35; skier.airE = 0; skier.airPeak = 10;
        sfx.hop();
      }
    } else if (skier.airT === 0) {      // airborne skiers clear everything else
      crash(obs.type);
      return;
    }
  }
}

function crash(what) {
  gameState = STATES.CRASHED;
  deathTimer = 0;
  endMsg = CRASH_MSGS[what] || 'You wiped out!';
  skiLoopStop();
  ufoHumStop();
  sfx.crash();
}

function updateCrashed(dt) {
  deathTimer += dt;
  if (deathTimer > 2) goGameOver();
}

// Shared end-of-run flow: local best, jingles, and the arcade initials
// entry screen when the run makes the world top 10
function goGameOver() {
  const best = saveHighScore();
  sfx.gameOver();
  if (best) sfx.best();
  fetchLB();
  entry.rank = 0;
  if (qualifiesLB(distance)) {
    let saved = 'AAA';
    try { saved = localStorage.getItem('skifree_initials') || 'AAA'; } catch (e) {}
    entry.slots = (saved + 'AAA').slice(0, 3).split('');
    entry.idx = 0;
    entry.submitting = false;
    gameState = STATES.ENTRY;
  } else {
    gameState = STATES.GAMEOVER;
  }
}

// ─── High Score ───────────────────────────────────────────────────────────────
function saveHighScore() {
  let best = false;
  try {
    const prev = parseInt(localStorage.getItem('skifree_hs') || '0', 10);
    best = distance > prev && prev > 0;
    if (distance > prev) localStorage.setItem('skifree_hs', distance);
    highScore = Math.max(distance, prev);
  } catch(e) { highScore = distance; }
  return best;
}
function loadHighScore() {
  try { highScore = parseInt(localStorage.getItem('skifree_hs') || '0', 10); }
  catch(e) { highScore = 0; }
}

// ─── Drawing ─────────────────────────────────────────────────────────────────
function drawBumps() {
  ctx.strokeStyle = '#b0b0b0';
  ctx.lineWidth = 2;
  for (const b of bumps) {
    const sy = ((b.wy - worldY) % 2000 + 2000) % 2000 - 200;
    if (sy < -30 || sy > H + 30) continue;
    ctx.beginPath(); ctx.arc(b.x, sy, 10, Math.PI, 0); ctx.stroke();
    ctx.beginPath(); ctx.arc(b.x + 16, sy + 5, 7, Math.PI, 0); ctx.stroke();
  }
}

function drawTrail() {
  if (trail.length < 2) return;
  ctx.strokeStyle = '#c8c8c8';
  ctx.lineWidth = 2;
  ctx.lineCap = 'butt';
  for (const side of [-4, 4]) {
    ctx.beginPath();
    let started = false, prevSy = 0;
    for (const p of trail) {
      const sy = p.wy - worldY + SKIER_Y;
      if (sy < -20) continue;
      if (!started) { ctx.moveTo(p.x + side, sy); started = true; }
      else if (sy - prevSy < 40) ctx.lineTo(p.x + side, sy);
      else ctx.moveTo(p.x + side, sy);    // gap where the skier was airborne
      prevSy = sy;
    }
    ctx.stroke();
  }
}

function drawLift() {
  // cables
  ctx.strokeStyle = '#808080';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(LIFT_X - 8, 0); ctx.lineTo(LIFT_X - 8, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(LIFT_X + 8, 0); ctx.lineTo(LIFT_X + 8, H); ctx.stroke();

  // towers, fixed in world space
  const m0 = Math.floor((worldY - SKIER_Y - 100) / 450);
  for (let m = m0; m < m0 + 4; m++) {
    const sy = m * 450 - worldY + SKIER_Y;
    if (sy < -40 || sy > H + 40) continue;
    ctx.fillStyle = '#606060';
    ctx.fillRect(LIFT_X - 3, sy - 34, 6, 34);
    ctx.fillRect(LIFT_X - 14, sy - 34, 28, 4);
    ctx.fillStyle = '#404040';
    ctx.fillRect(LIFT_X - 6, sy - 4, 12, 4);
  }

  // chairs riding up the mountain (with the occasional passenger)
  const G = 130;
  const offset = (worldY + liftDist) % G;
  for (let k = -1; k < H / G + 1; k++) {
    const cy = k * G - offset;
    if (cy < -20 || cy > H + 20) continue;
    ctx.fillStyle = '#404040';
    ctx.fillRect(LIFT_X + 6, cy, 2, 10);       // hanger
    ctx.fillRect(LIFT_X + 2, cy + 10, 12, 3);  // seat
    if ((k + Math.floor((worldY + liftDist) / G)) % 3 === 0) {
      ctx.fillStyle = PAL.R; ctx.fillRect(LIFT_X + 5, cy + 2, 4, 3);   // rider hat
      ctx.fillStyle = PAL.P; ctx.fillRect(LIFT_X + 4, cy + 5, 6, 5);   // rider body
    }
  }
}

function drawObstacle(obs) {
  const sy = obs.worldY - worldY + SKIER_Y;
  if (sy < -60 || sy > H + 60) return;
  const x = obs.x;

  switch (obs.type) {
    case 'tree':  sprite(TREE_BUSHY, x, sy, 2); break;
    case 'pine':  sprite(TREE_PINE, x, sy, 2); break;
    case 'rock':  sprite(ROCK, x, sy, 2); break;
    case 'stump': sprite(STUMP, x, sy, 2); break;
    case 'sign':  sprite(obs.variant ? SIGN_R : SIGN_L, x, sy, 2); break;
    case 'flag':  sprite(obs.variant ? FLAG_B : FLAG_R, x, sy, 2); break;
    case 'jump':  sprite(JUMP_RAMP, x, sy, 2, obs.variant === 1); break;
    case 'mogul':
      ctx.strokeStyle = '#a0a0a0';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, sy, 13, Math.PI, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(x - 6, sy + 4, 8, Math.PI, 0); ctx.stroke();
      break;
  }
}

function drawDogs() {
  for (const d of dogs) {
    const sy = d.wy - worldY + SKIER_Y;
    if (sy < -40 || sy > H + 40) continue;
    sprite(d.dir > 0 ? DOG_2 : DOG_1, d.x, sy, 2, d.dir > 0);
    if (d.woofT > 1.5) {
      drawText('WOOF! WOOF!', d.x, sy - 28, 11, '#000');
    }
  }
}

function drawSnowballs() {
  for (const b of snowballs) {
    const sy = b.worldY - worldY + SKIER_Y;

    // still off the top: blinking warning marker in its lane
    if (sy < -b.r) {
      if (Math.floor(globalTime * 6) % 2 === 0) {
        drawText('!', b.x, 22, 26, '#c00000');
      }
      continue;
    }
    if (sy > H + b.r + 20) continue;

    // pixel powder puffs trailing behind (classic arc strokes, like the moguls)
    ctx.strokeStyle = '#b0b0b0';
    ctx.lineWidth = 2;
    for (let i = 1; i <= 3; i++) {
      const px = Math.round(b.x + Math.sin(b.rot * 2 + i) * 5);
      const py = Math.round(sy - b.r - i * 14);
      ctx.beginPath();
      ctx.arc(px, py, 8 - i * 2, Math.PI, 0);
      ctx.stroke();
    }

    // the ball itself: chunky two-frame pixel sprite, alternating to roll
    const frame = Math.floor(b.rot * 2) % 2 === 0 ? SNOWBALL_1 : SNOWBALL_2;
    sprite(frame, b.x, sy + b.r, 3);
  }
}

function drawSkier() {
  if (gameState === STATES.CRASHED) {
    sprite(SKIER_CRASH, skier.x, SKIER_Y + 20, 2);
    // dizzy stars
    ctx.fillStyle = '#000';
    for (let i = 0; i < 3; i++) {
      const a = globalTime * 5 + i * 2.1;
      const sx = Math.round(skier.x + Math.cos(a) * 22);
      const sy = Math.round(SKIER_Y - 22 + Math.sin(a) * 6);
      ctx.fillRect(sx - 1, sy - 3, 2, 7);
      ctx.fillRect(sx - 3, sy - 1, 7, 2);
    }
    if (deathTimer < 1.2) drawText('OUCH!', skier.x + 34, SKIER_Y - 24, 13, '#000', 'left');
    return;
  }

  if (gameState === STATES.CAPTURED) {
    if (!cap.visible) return;
    ctx.save();
    ctx.translate(Math.round(cap.x), Math.round(cap.y));
    ctx.rotate(cap.rot);
    sprite(SKIER_DOWN, 0, 17, 2);
    ctx.restore();
    return;
  }

  // airborne arc
  let lift = 0, rot = 0;
  if (skier.airT > 0) {
    const f = skier.airE / skier.airT;
    lift = Math.sin(Math.PI * f) * skier.airPeak;
    if (skier.airPeak > 20) rot = f * Math.PI * 2;   // backflip off the big ramp
    // landing shadow
    ctx.strokeStyle = '#b0b0b0';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(skier.x, SKIER_Y + 20, 12, 4, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  const g = skier.vx;
  ctx.save();
  ctx.translate(Math.round(skier.x), Math.round(SKIER_Y + 17 - lift));
  if (rot) ctx.rotate(rot);
  if (Math.abs(g) < 60) sprite(SKIER_DOWN, 0, 17, 2);
  else sprite(SKIER_TURN, 0, 17, 2, g > 0);
  ctx.restore();
}

function drawMonster() {
  if (!monster.active && gameState !== STATES.CAPTURED) return;

  const def = MON_DEFS[monster.type];
  const grid = def.grids[monster.animFrame % 2];
  const sy = (gameState === STATES.CAPTURED)
    ? monster.sy
    : monster.worldY - worldY + SKIER_Y;
  if (sy < -110 || sy > H + 110) return;

  let bob = 0;
  if (monster.type === 'ufo') bob = Math.sin(globalTime * 3) * 4;

  // UFO tractor beam during the grab
  if (monster.type === 'ufo' && gameState === STATES.CAPTURED &&
      monster.phase === 'grab' && monster.t > 0.4 && cap.visible) {
    ctx.fillStyle = `rgba(0,255,0,${0.25 + 0.12 * Math.sin(globalTime * 18)})`;
    ctx.beginPath();
    ctx.moveTo(monster.x - 12, sy - 4);
    ctx.lineTo(monster.x + 12, sy - 4);
    ctx.lineTo(monster.x + 34, SKIER_Y + 24);
    ctx.lineTo(monster.x - 34, SKIER_Y + 24);
    ctx.closePath();
    ctx.fill();
  }

  const flip = monster.vx > 10 || (monster.phase === 'exit' && monster.exitVX > 0);
  sprite(grid, monster.x, sy + bob, def.scale, flip);

  // chomp flair for the biters
  if (gameState === STATES.CAPTURED && monster.phase === 'grab' &&
      (monster.type === 'yeti' || monster.type === 'dino') &&
      Math.floor(monster.t * 4) % 2 === 0) {
    drawText('CHOMP!', monster.x, sy - def.grids[0].length * def.scale - 14, 14, '#000');
  }
}

// ─── Main Draw ───────────────────────────────────────────────────────────────
function draw() {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  drawBumps();
  drawTrail();
  drawLift();

  const sorted = [...obstacles].sort((a, b) => a.worldY - b.worldY);
  for (const obs of sorted) if (obs.worldY <= worldY) drawObstacle(obs);
  drawDogs();
  drawSkier();
  for (const obs of sorted) if (obs.worldY > worldY) drawObstacle(obs);
  drawSnowballs();
  drawMonster();

  drawHUD();

  // "RUN!" warning while a fresh monster closes in
  if (gameState === STATES.PLAYING && monster.active && monster.phase === 'chase' &&
      monsterWarnT > 0 && Math.floor(monsterWarnT * 4) % 2 === 0) {
    drawText(IS_TOUCH ? 'RUN!!  (tilt forward to escape)' : 'RUN!!  (hold ↓ to escape)', W/2, 110, 17, '#c00000');
  }

  // "you escaped!" banner
  if (gameState === STATES.PLAYING && escapeFlash > 0) {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(W/2 - 160, 96, 320, 28);
    ctx.strokeStyle = '#000';
    ctx.strokeRect(W/2 - 160.5, 96.5, 320, 28);
    drawText(escapeMsg, W/2, 110, 14, '#006000');
  }

  if (gameState === STATES.START)    drawStartScreen();
  if (gameState === STATES.ENTRY)    drawEntryScreen();
  if (gameState === STATES.GAMEOVER) drawGameOverScreen();
}

// ─── Game Loop ────────────────────────────────────────────────────────────────
let lastTime = -1;

function loop(now) {
  const dt = lastTime < 0 ? 0 : Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  globalTime += dt;

  if (gameState === STATES.START) {
    worldY += 90 * dt;
    liftDist += 60 * dt;
    spawnObstacles();
  } else {
    update(dt);
  }

  draw();
  requestAnimationFrame(loop);
}

// ─── Input ────────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  keys[e.code] = true;

  const steerKeys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyA','KeyD','KeyW','KeyS','Space'];
  if (steerKeys.includes(e.code)) {
    e.preventDefault();
    mouseMode = false;
  }
  if (e.code === 'F2') e.preventDefault();
  if (e.code === 'KeyM' && gameState !== STATES.ENTRY) { setMuted(!muted); return; }

  // Arcade initials entry
  if (gameState === STATES.ENTRY) {
    if (entry.submitting) return;
    if (e.code === 'ArrowLeft')       { entry.idx = (entry.idx + 2) % 3; sfx.hop(); }
    else if (e.code === 'ArrowRight') { entry.idx = (entry.idx + 1) % 3; sfx.hop(); }
    else if (e.code === 'ArrowUp')    { cycleEntryChar(1); }
    else if (e.code === 'ArrowDown')  { cycleEntryChar(-1); }
    else if (e.code === 'Backspace')  { entry.idx = (entry.idx + 2) % 3; }
    else if (e.code === 'Enter' || e.code === 'Space') { submitEntry(); sfx.start(); }
    else if (/^Key([A-Z])$/.test(e.code)) {
      entry.slots[entry.idx] = e.code.slice(3);
      entry.idx = Math.min(entry.idx + 1, 2);
      sfx.hop();
    }
    else if (/^Digit(\d)$/.test(e.code)) {
      entry.slots[entry.idx] = e.code.slice(5);
      entry.idx = Math.min(entry.idx + 1, 2);
      sfx.hop();
    }
    return;
  }

  if (gameState === STATES.START) {
    loadHighScore();
    resetGame();
  } else if (gameState === STATES.GAMEOVER && (e.code === 'KeyR' || e.code === 'F2')) {
    loadHighScore();
    resetGame();
  } else if (gameState === STATES.PLAYING && e.code === 'F2') {
    loadHighScore();
    resetGame();
  }
});

document.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W / rect.width);
  mouseMode = true;
});
canvas.addEventListener('mouseleave', () => { mouseMode = false; });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  enableTilt();   // user gesture — safe place to request iOS motion permission
  const rect = canvas.getBoundingClientRect();
  const cx = (e.touches[0].clientX - rect.left) * (W / rect.width);
  const cy = (e.touches[0].clientY - rect.top)  * (H / rect.height);

  if (gameState === STATES.ENTRY) { entryTap(cx, cy); return; }

  // Tilt badge toggle (top-left corner) — generous hit area
  if ((gameState === STATES.PLAYING || gameState === STATES.START) && cx < 150 && cy < 40) {
    tiltBadgeTap();
    return;
  }

  if (gameState === STATES.START || gameState === STATES.GAMEOVER) {
    loadHighScore(); resetGame(); return;
  }
  mouseX = cx;
  mouseMode = true;
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.touches[0].clientX - rect.left) * (W / rect.width);
  mouseMode = true;
}, { passive: false });

// iOS accepts the motion-permission request only from touchend/click gestures
canvas.addEventListener('touchend', () => { enableTilt(); mouseMode = false; });

canvas.addEventListener('click', e => {
  enableTilt();
  if (gameState === STATES.ENTRY) {
    if (IS_TOUCH) return;   // touchstart already handled it
    const rect = canvas.getBoundingClientRect();
    entryTap(
      (e.clientX - rect.left) * (W / rect.width),
      (e.clientY - rect.top)  * (H / rect.height)
    );
    return;
  }
  if (gameState === STATES.START) {
    loadHighScore(); resetGame(); return;
  }
  if (gameState === STATES.GAMEOVER) {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.clientX - rect.left) * (W / rect.width);
    const cy = (e.clientY - rect.top)  * (H / rect.height);
    const b  = gameOverLayout().btn;
    if (cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h) {
      loadHighScore(); resetGame();
    }
  }
});

// ─── Boot ─────────────────────────────────────────────────────────────────────
loadHighScore();
fetchLB();
gameState = STATES.START;
worldY = 0;
worldSpeed = BASE_SPEED;
obstacles = []; dogs = []; liftDist = 0;
makeBumps();
spawnObstacles();

requestAnimationFrame(loop);
</script>
</body>
</html>
