name: Deploy Ski Free 2 to GitHub Pages

on:
  push:
    branches: [claude/yearly-calendar-app-3XUBJ]   # repo default branch
    paths:
      - 'ski-free/**'
      - '.github/workflows/deploy-skifree.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # auto-enable Pages on first run
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ski-free
      - id: deployment
        uses: actions/deploy-pages@v4
